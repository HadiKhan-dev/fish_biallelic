# General AD-based reconstruction. Paths are relative to the working directory.
[inputs]
vcf = "work/data/cross.bcf"
# contigs = ["chr1", "chr2", "chr3"]
# Optional named eligibility/chronology constraints, never inferred from IDs.
# eligibility = "work/data/eligibility.json"

[run]
output = "work/runs/cross"
cores = "auto"
# batch_queue = "/shared/run/batches" # Optional helpers: haplotypes batch-worker --queue PATH
# serial_contigs = true # One contig at a time, each checkpointed; for short allocations.
# max_contigs = 2 # Finish at most 2 more contigs per invocation; implies serial_contigs.
# read_calibration = true # Default: fit the observation model from allele depths.
# pedigree_calibration = "predictive" # Default: learn the chromosome-evidence scale.
# stop_after_stage = "painting"
founder_refinement = "on"

[recombination]
rate_cm_per_mb = 5.0
shared_family_evidence = true
# recombination_map = "work/data/cross.map"
