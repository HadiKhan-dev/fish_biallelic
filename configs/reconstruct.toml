# General AD-based reconstruction of any cross: `haplotypes run configs/reconstruct.toml`.
# Paths are relative to the working directory. Inference reads only the VCF/BCF and the genetic map: sample names
# are identifiers, and every sequenced sample is a candidate parent of every other.
[run]
output = "work/runs/cross"
# stop_after = "painting"

[input]
kind = "vcf"
vcf = "work/data/cross.bcf"
contigs = ["chr1", "chr2", "chr3"]       # required: the contigs to analyse, in order

# [quality]
# read_calibration = true           # fit the read model from allele depths (default)

# [execution]
# cores = "auto"
# memory_limit = "auto"
# serial = true
# max_contigs = 2
# batch_queue = "/shared/run/batches"

[genetic_map]
rate_cm_per_mb = 5.0
# file = "work/data/cross.map"

[recombination]
# order_breakpoints = "breakpoints.tsv"   # reference-order breakpoints (chrom, start, end, reason)
