# Simulated cross with known truth: `haplotypes run configs/simulation.toml`, then `haplotypes evaluate RUN`.
# Output defaults to work/runs/simulation_seed<seed>; each seed has its own checkpoints.
[input]
kind = "simulation"
contigs = ["chr1", "chr2", "chr3", "chr4", "chr5", "chr6", "chr7", "chr8", "chr9", "chr10", "chr11", "chr12", "chr13", "chr14", "chr15", "chr16", "chr17", "chr18", "chr19", "chr20", "chr22", "chr23"]

[simulation]
templates = "work/data/simulation_templates"
seed = 400
depth = 5.0
cohorts = [20, 100, 200]
generating_rate_cm_per_mb = 5.0
# generating_map = "work/data/generating.map"
# Optional data-generation controls, independent of inference:
# backcross_fraction = 0.5
# backcross_start_cohort = 3
# observe_cohorts = [4, 5, 6]
# observed_fraction = 0.8

# [simulation.reads]
# error_rate = 0.04
# depth_cv = 0.6
# heterozygote_alt_probability = 0.6
# dropout_fraction = 0.1

# [execution]
# process_contigs = ["chr1", "chr2"]   # shard: these contigs through painting only

[genetic_map]
rate_cm_per_mb = 5.0
# file = "work/data/inference.map"

[recombination]
# order_breakpoints = "breakpoints.tsv"   # reference-order breakpoints (chrom, start, end, reason)
