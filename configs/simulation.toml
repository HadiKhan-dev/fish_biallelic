version = 4

[input]
kind = "simulation"
contigs = ["c1", "c2"]

[execution]
cores = 4

[simulation]
seed = 400
depth = 5.0
cohorts = [40, 80, 160]
founders = {left = 3, right = 3}

[simulation.reads]
# Short paired-end reads: 150 bp mates of ~375 bp fragments, so neighbouring sites share reads; 1 % of reads at a
# homozygous site show the other allele.
read_length_bp = 150
fragment_mean_bp = 375.0
fragment_sd_bp = 150.0
error_rate = 0.01

[simulation.genome]
contigs = ["c1", "c2"]
length_bp = 1000000

[simulation.sites]
count = 10000
profile = "cascade"

[simulation.source]
kind = "coalescent"
reference_population = "ancestral"

[simulation.source.populations.ancestral]
size = 500.0

# Optional call-set artefacts, applied after reads:
# [simulation.artefacts]
# preset = "reference_blocks"
# balance_dispersion = 0.0  # required with reads (read_length_bp or long_read_mean_bp > 0)

[simulation.stocks.left]
population = "ancestral"
founders = 6
size = 12
generations = 4

[simulation.stocks.right]
population = "ancestral"
founders = 6
size = 12
generations = 4
