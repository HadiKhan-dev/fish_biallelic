# AulStu cross (AsAc BCF), whole genome: `haplotypes run configs/astcal.toml`.
# The aulstu preset supplies the 22 autosomes. Inference reads only the BCF and the genetic map (no sample metadata):
# every sequenced sample is a candidate parent of every other. Paths are relative to the working directory. Large-K
# data: expect long, memory-paced runs; use full nodes and resume from checkpoints.
preset = "aulstu"

[run]
output = "work/runs/astcal"

[input]
kind = "vcf"
vcf = "work/data/fish_vcf_restriped/AsAc.AulStuGenome.biallelic.bcf.gz"

# [execution]
# cores = "auto"
# memory_limit = "auto"
# serial = true
# max_contigs = 2

[genetic_map]
rate_cm_per_mb = 5.0
# file = "work/data/cross.map"

[recombination]
# order_breakpoints = "breakpoints.tsv"   # reference-order breakpoints (chrom, start, end, reason)
