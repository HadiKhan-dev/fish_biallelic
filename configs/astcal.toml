[run]
cores = "auto"
assembly_model = "dense" # "structured" gives near-quadratic assembly.
discovery_search = "standard" # Independent; "batched" remains experimental.
output = "work/runs/astcal"

[inputs]
vcf = "work/data/fish_vcf_restriped/AsAc.AulStuGenome.biallelic.bcf.gz"
metadata = "work/data/fish_vcf_restriped/X_AsAc_metafile.xlsx"
metadata_sheet = "main_data"

[recombination]
rate_cm_per_mb = 5.0
shared_family_evidence = true
# recombination_map = "work/data/cross.map"
