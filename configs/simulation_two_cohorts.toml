version = 4

[input]
kind = "simulation"
contigs = ["c1", "c2"]

[execution]
cores = 4

[simulation]
seed = 400
depth = 5.0
cohorts = [160, 160]
founders = {left = 18, right = 8}

[simulation.reads]
# ONT-like long reads: lognormal lengths with mean 30 kb and log-SD 0.9 (median 20 kb, about 4 % longer than 100 kb);
# per-read Phred quality ~ Normal(15, 3), a mean per-base error of about 4 %.
long_read_mean_bp = 30000.0
long_read_length_sigma = 0.9
read_quality_mean = 15.0
read_quality_sd = 3.0

[simulation.genome]
contigs = ["c1", "c2"]
length_bp = 1000000

[simulation.sites]
count = 10000
profile = "cascade"

[simulation.source]
kind = "coalescent"
reference_population = "ancestral"

[simulation.source.populations.ancestral]
size = 500.0

# Optional call-set artefacts, applied after reads:
# [simulation.artefacts]
# preset = "reference_blocks"
# balance_dispersion = 0.0  # required with reads (the reads set the allele balance)

[simulation.stocks.left]
population = "ancestral"
founders = 30
size = 50
generations = 15

[simulation.stocks.right]
population = "ancestral"
founders = 30
size = 50
generations = 15
