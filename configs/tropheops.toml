[run]
cores = "auto"
# batch_queue = "/shared/run/batches" # Optional helpers: haplotypes batch-worker --queue PATH
# read_calibration = true # Default: fit the observation model from allele depths.
# pedigree_calibration = "predictive" # Default: learn the chromosome-evidence scale.
assembly_model = "dense" # "structured" is near quadratic with bounded search.
assembly_search = "bounded" # "broad" retains the optimized broader full-refit search.
founder_refinement = "on" # Final chromosome paths; "off" is a controlled comparison.
discovery_search = "standard" # Independent; "batched" remains experimental.
feedback_selection = "path" # Normalized local path model, with an explicit unknown state.
# feedback_segment_exchange = false # Optional final same-count segment proposals.
output = "work/runs/tropheops"

[inputs]
vcf = "work/data/fish_vcf_restriped/AcTm.biallelic.bcf.gz"
metadata = "work/data/fish_vcf_restriped/X_AcTm_metadata.xlsx"
metadata_sheet = "main_data"

[recombination]
rate_cm_per_mb = 5.0
shared_family_evidence = true
# recombination_map = "work/data/cross.map"
