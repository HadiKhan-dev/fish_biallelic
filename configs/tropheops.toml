# TroMau cross (AcTm BCF), whole genome: `haplotypes run configs/tropheops.toml`.
# The tromau preset supplies the 22 autosomes. Inference reads only the BCF and the genetic map (no sample metadata):
# every sequenced sample is a candidate parent of every other. Paths are relative to the working directory.
preset = "tromau"

[run]
output = "work/runs/tropheops"
# stop_after = "painting"           # or "discovery"; remove to continue downstream

[input]
kind = "vcf"
vcf = "work/data/fish_vcf_restriped/AcTm.biallelic.bcf.gz"

# [execution]
# cores = "auto"                    # total CPU ceiling; auto = CPU affinity
# memory_limit = "auto"             # e.g. "200G"; the memory governor slows work down to fit
# serial = true                     # one contig at a time, each recorded (short allocations)
# max_contigs = 2                   # finish at most 2 more contigs per invocation; implies serial
# batch_queue = "/shared/run/batches"  # helpers: haplotypes batch-worker QUEUE

[genetic_map]
rate_cm_per_mb = 5.0
# file = "work/data/cross.map"

[recombination]
# order_breakpoints = "breakpoints.tsv"   # reference-order breakpoints (chrom, start, end, reason)

# [export]                          # founder + phased sample VCFs in OUTPUT/export (on by default)
# full_length = true                # every input SNP, FILTER = PASS or the site-filter rule
