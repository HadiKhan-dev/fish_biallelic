[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "haplotype-reconstruction"
version = "4.10.0"
description = "Founder-haplotype reconstruction, pedigree, phase and recombination maps for experimental crosses"
readme = "README.md"
license = "MIT"
authors = [{name = "Hadi Khan"}]
requires-python = ">=3.14"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Reference-only envelope; exact tested pins are in requirements-tested.txt.
# hdbscan remains required by discovery's imported MST implementation.
dependencies = [
  "numpy>=2.5.4",
  "numba>=0.68.0",
  "llvmlite>=0.50.0",
  "scipy>=1.18.1",
  "pandas>=3.0.6",
  "cyvcf2>=0.34.0",
  "blosc2>=4.14.1",
  "matplotlib>=3.11.2",
  "threadpoolctl>=3.7.0",
  "hdbscan>=0.8.44",
]

[project.urls]
Repository = "https://github.com/HadiKhan-dev/fish_biallelic"

[project.scripts]
haplotypes = "haplotype_reconstruction.interface.cli:main"

[tool.setuptools]
include-package-data = false
platforms = ["Linux x86_64"]

[tool.setuptools.package-data]
haplotype_reconstruction = ["interface/settings/presets/*.toml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["haplotype_reconstruction*"]
namespaces = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "tests/oracle/extract",
    # Frozen witness extractors whose bytes are pinned by digest in fixture manifests (dise40c, 1 Nov).
    "tests/oracle/fast/discovery_fixed_k/trajectory_trace.py",
    "tests/oracle/fast/discovery_search_witness/closest_boundary.py",
    "tests/oracle/fast/discovery_search_witness/native_cache.py",
    "tests/oracle/fast/selection_search_witness/boundary_inputs.py",
]

[tool.ruff.lint]
select = ["E", "F", "F403", "F405", "W", "B", "I", "UP", "T20"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"haplotype_reconstruction/interface/**" = ["T20"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["haplotype_reconstruction/contracts", "haplotype_reconstruction/stages", "haplotype_reconstruction/interface"]

[[tool.mypy.overrides]]
module = ["haplotype_reconstruction.contracts.*", "haplotype_reconstruction.stages.*", "haplotype_reconstruction.interface.api"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
markers = [
  "threads: thread-count identity checks run with NUMBA_NUM_THREADS=4 without xdist",
  "stage: stage-tier oracle tests (minutes, run on a node)",
  "slow: reference implementations and long property tests",
]
addopts = "--import-mode=importlib -m 'not stage and not slow'"
