[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haplotype-reconstruction"
version = "2.15.0"
description = "Founder-haplotype reconstruction, pedigree, phase and recombination maps for experimental crosses"
readme = "README.md"
license = "MIT"
authors = [{name = "Hadi Khan"}]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "numba>=0.61",
  "scipy>=1.13",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "cyvcf2>=0.31",
  "blosc2>=4.0",
  "matplotlib>=3.9",
  "hdbscan>=0.8.40",
]

[project.urls]
Repository = "https://github.com/HadiKhan-dev/fish_biallelic"

[project.scripts]
haplotypes = "haplotype_reconstruction.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["haplotype_reconstruction*"]
namespaces = false

[tool.setuptools.package-data]
"haplotype_reconstruction.config" = ["presets/*.toml"]
"haplotype_reconstruction.execution" = ["kernel_manifest.json"]
