fragment_mean_bp = 375.0
fragment_sd_bp = 150.0
error_rate = 0.01

[simulation.source]
kind = "coalescent"

[simulation.source.populations.ancestral]
size = 500.0

[simulation.stocks.base]
population = "ancestral"
founders = 3
size = 3
generations = 0
