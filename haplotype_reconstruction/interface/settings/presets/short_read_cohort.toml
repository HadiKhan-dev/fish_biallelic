# Cohort read model; companion site and balance settings are in the reference configuration.
# Depth is unimpaired depth; coarse and fine loss each multiply the mean by 1 - fraction / 2.
[simulation.reads]
depth_cv = 0.21
read_length_bp = 150
fragment_mean_bp = 375.0
fragment_sd_bp = 150.0
error_rate = 0.0035
# Allelic imbalance is read-level (4.22): the retired per-cell 0.48 balance became a mate mapping loss; an isolated
# heterozygote keeps exp(-0.07) / (1 + exp(-0.07)) = 0.483 of its reads as ALT with non-overlapping mates (overlapping
# mates raise it, nearby ALT alleles lower it). Not refitted to the 290-sample cohort.
reference_bias = 0.07
reference_bias_power = 2.0
dropout_fraction = 0.0
site_depth_cv = 0.1
site_depth_window_bp = 4500
site_loss_fraction = 0.42
site_loss_fine_fraction = 0.1
site_loss_fine_window_bp = 300
region_depth_cv = 0.27
region_depth_window_bp = 4000
count_dispersion = 0.0
