<text x="354.0" y="65.0" font-size="11.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1a1a1a">Discovery</text>
<text x="354.0" y="79.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">local founder</text>
<text x="354.0" y="91.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">panels in blocks</text>
<text x="354.0" y="103.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">(missing-aware)</text>
<rect x="430" y="40" width="150" height="82" rx="7" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="505.0" y="65.0" font-size="11.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1a1a1a">Local selection</text>
<text x="505.0" y="79.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">rounds initial, L1, L2,</text>
<text x="505.0" y="91.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">each fed by an</text>
<text x="505.0" y="103.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">assembly context</text>
<rect x="596" y="40" width="138" height="82" rx="7" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="1.4"/>
