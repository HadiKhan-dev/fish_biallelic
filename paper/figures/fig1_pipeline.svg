<text x="214.0" y="79.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">read model,</text>
<text x="214.0" y="91.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">genotype likelihoods,</text>
<text x="214.0" y="103.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">site and sample QC</text>
