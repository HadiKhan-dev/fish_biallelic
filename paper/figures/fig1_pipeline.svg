<text x="803.0" y="85.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">diploid founder</text>
<text x="803.0" y="97.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">mosaics</text>
<rect x="872" y="40" width="100" height="82" rx="7" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="922.0" y="71.0" font-size="11.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1a1a1a">Refit</text>
<text x="922.0" y="85.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">founder alleles</text>
<text x="922.0" y="97.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">from paintings</text>
<rect x="150" y="182" width="220" height="64" rx="7" fill="#fdf0e3" stroke="#b8621b" stroke-width="1.4"/>
<text x="260.0" y="204.0" font-size="11.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1a1a1a">Relatedness</text>
<text x="260.0" y="218.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">pairwise IBD, full-sib families</text>
<text x="260.0" y="230.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">from every contig's evidence</text>
<rect x="596" y="182" width="260" height="64" rx="7" fill="#fdf0e3" stroke="#b8621b" stroke-width="1.4"/>
<text x="726.0" y="204.0" font-size="11.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1a1a1a">Pedigree</text>
<text x="726.0" y="218.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">every sample a candidate parent;</text>
<text x="726.0" y="230.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">sibling guard, release tiers</text>
<rect x="560" y="316" width="150" height="78" rx="7" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="635.0" y="339.0" font-size="11.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1a1a1a">Family phase</text>
<text x="635.0" y="353.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">phase conditional on</text>
<text x="635.0" y="365.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">the pedigree;</text>
<text x="635.0" y="377.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">meiosis chains</text>
<rect x="726" y="316" width="124" height="78" rx="7" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="1.4"/>
