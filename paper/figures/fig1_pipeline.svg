<text x="788.0" y="359.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">maps from</text>
<text x="788.0" y="371.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">the final phase</text>
<rect x="866" y="316" width="106" height="78" rx="7" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="1.4"/>
