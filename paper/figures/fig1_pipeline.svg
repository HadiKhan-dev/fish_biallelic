<text x="665.0" y="79.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">joins, founder count,</text>
<text x="665.0" y="91.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">completion,</text>
<text x="665.0" y="103.0" font-size="9.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5f6368">refinement</text>
