This supplement gives the finer rules of every stage, with the default value of each named
parameter. Codes in parentheses (for example EC05 or AJ17) identify the method unit in the
software's methods documentation (`docs/methods/` in the repository), where each rule is stated in
full together with the code that implements it. Default values are those of the generated parameter
reference (`docs/reference/parameters.md`) for release 4.3.0.
