# Project-scoped Codex configuration.
# Keep the primary-thread model and reasoning level under user/UI control.
# AGENTS.md is intentionally detailed and exceeds Codex's default 32 KiB budget.
project_doc_max_bytes = 65536

# Enable the expanded context window while compacting history at 500k tokens.
# Keep these top-level so they apply independently of the model/reasoning
# selection made in the UI.
model_context_window = 1050000
model_auto_compact_token_limit = 500000
model_auto_compact_token_limit_scope = "total"

[agents]
enabled = true
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"
interrupt_message = true
# No max_concurrent_threads_per_session is set: use the orchestrator default.